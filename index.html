
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#334538">
<title>MOTIF | Digital Menu</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --green:#334538;
  --olive:#77845f;
  --bg:#f5f6f1;
  --line:#e0e5da;
  --dark:#233327;
}

* {box-sizing:border-box}
html {scroll-behavior:smooth}

body {
  margin:0;
  background:var(--bg);
  color:var(--dark);
  font-family:Vazirmatn,Tahoma,sans-serif;
  padding-bottom:85px;
}
button,input {font:inherit}
button {cursor:pointer}

.hero {
  height:245px;
  background:
    linear-gradient(90deg,#20382bd9,#334538b8),
    url('images/cafe-banner.jpeg') center/cover;
  display:grid;
  place-items:center;
  color:#fff;
  text-align:center;
}
.hero img {
  max-width:min(350px,85%);
  max-height:140px;
  object-fit:contain;
  filter:brightness(0) invert(1);
}
.hero h1 {
  font-family:Georgia,serif;
  font-size:48px;
  letter-spacing:7px;
  margin:0;
}
.hero p {
  font-size:13px;
  letter-spacing:3px;
  margin:3px 0;
}

.top {
  position:sticky;
  top:0;
  background:#fffffff2;
  z-index:20;
  box-shadow:0 4px 25px #20382b16;
  padding:14px max(18px,calc((100vw - 1320px)/2));
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}
.tabs,.tools,.rail {
  display:flex;
  align-items:center;
  gap:9px;
}
.tabs {flex-wrap:wrap}
.tab,.chip,.small {
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  color:var(--green);
  padding:9px 16px;
  font-weight:700;
}
.tab.active,.chip.active {
  background:var(--green);
  color:#fff;
}
.tools input {
  background:#f7f9f5;
  border:1px solid var(--line);
  padding:10px 14px;
  border-radius:12px;
  width:min(260px,40vw);
  outline:none;
}

main {
  width:min(1320px,calc(100% - 36px));
  margin:30px auto;
}
.welcome {
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}
.welcome h2 {
  margin:0;
  font-size:25px;
}
.hint {
  color:#718072;
  font-size:13px;
}
.rail {
  overflow-x:auto;
  padding:17px 0;
  scrollbar-width:thin;
}
.chip {
  white-space:nowrap;
  font-size:13px;
}

.group {
  margin:22px 0 35px;
  scroll-margin-top:150px;
}
.heading {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:15px;
}
.heading h3 {
  font-size:19px;
  margin:0;
}
.heading:after {
  content:'';
  height:1px;
  background:var(--line);
  flex:1;
}

/* Product grid */
.products {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px;
}
.product {
  position:relative;
  display:flex;
  gap:14px;
  align-items:center;
  min-height:153px;
  background:#fff;
  border:1px solid #e7ebe4;
  border-radius:19px;
  padding:12px;
  box-shadow:0 5px 18px #192b1a0a;
  transition:transform .2s;
}
.product:hover {
  transform:translateY(-2px);
}
.photo {
  width:116px;
  height:125px;
  flex:none;
  object-fit:cover;
  background:#e8eee5;
  border-radius:14px;
}
.details {
  min-width:0;
  flex:1;
  display:flex;
  flex-direction:column;
  gap:7px;
}
.name {
  font-size:15px;
  font-weight:800;
  line-height:1.7;
}
.desc {
  font-size:12px;
  color:#7a857c;
  line-height:1.7;
}
.cost {
  color:var(--green);
  font-size:17px;
  font-weight:800;
  margin-top:auto;
}
.add {
  position:absolute;
  bottom:10px;
  left:10px;
  background:var(--olive);
  color:#fff;
  border:0;
  border-radius:50%;
  height:32px;
  width:32px;
  font-size:22px;
  line-height:26px;
}

#status {
  padding:18px;
  border:1px dashed var(--line);
  border-radius:12px;
  color:#677568;
  text-align:center;
  margin:20px 0;
}

/* Footer */
.footer {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  box-shadow:0 -5px 25px #18291c22;
  padding:12px max(20px,calc((100vw - 1320px)/2));
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  z-index:21;
}
.primary {
  border:0;
  background:var(--green);
  color:#fff;
  border-radius:100px;
  padding:12px 22px;
  font-weight:700;
}
.footer a {
  color:var(--green);
  text-decoration:none;
  font-size:13px;
  font-weight:700;
}

/* Selection drawer */
.drawer-back {
  position:fixed;
  inset:0;
  background:#192d21a8;
  z-index:29;
  display:none;
}
.drawer {
  position:fixed;
  top:0;
  bottom:0;
  left:0;
  width:min(430px,90vw);
  background:#fff;
  z-index:30;
  transform:translateX(-110%);
  transition:transform .25s;
  padding:22px;
  overflow:auto;
}
.drawer.open {
  transform:translateX(0);
}
.drawer-back.open {
  display:block;
}
.drawer-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.drawer-item {
  border-bottom:1px solid var(--line);
  padding:12px 0;
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.drawer-item button {
  border:0;
  background:#f8e9e7;
  color:#9a413b;
  border-radius:8px;
}
.drawer-actions {
  display:flex;
  gap:10px;
  margin-top:18px;
  flex-wrap:wrap;
}
.empty {
  padding:40px 15px;
  text-align:center;
  color:#809082;
}

/* Responsive design */
@media(max-width:1050px) {
  .products {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}
@media(max-width:680px) {
  .hero {height:190px}
  .hero h1 {font-size:36px}
  .top {padding:10px}
  .tabs {
    width:100%;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
  }
  .tab {
    padding:9px 3px;
    font-size:12px;
  }
  .tools {
    width:100%;
    justify-content:space-between;
  }
  .tools input {
    width:min(320px,75vw);
  }
  main {
    width:calc(100% - 24px);
    margin:20px auto;
  }
  .products {
    grid-template-columns:1fr;
    gap:10px;
  }
  .product {
    min-height:115px;
    padding:9px;
  }
  .photo {
    width:103px;
    height:105px;
  }
  .name {font-size:14px}
  .cost {font-size:14px}
  .heading h3 {font-size:17px}
}
</style>

<style>
/* MOTIF – Visual Infographic Upgrade */

:root {
  --green: #2b4033;
  --olive: #737b52;
  --bg: #f7f7f1;
  --dark: #233529;
  --line: #e3e8dd;
}

body {
  background: var(--bg);
}

/* Main visual header */
.hero {
  height: 320px;
  position: relative;
  background:
    linear-gradient(105deg,#213727cb,#45654c8a),
    url('images/cafe-banner.jpeg') center/cover;
  overflow: hidden;
}

.hero::before {
  content: "";
  position: absolute;
  width: 500px;
  height: 500px;
  right: -130px;
  top: -290px;
  border-radius: 50%;
  border: 2px solid #ffffff30;
  box-shadow:
    0 0 0 85px #ffffff0c,
    0 0 0 175px #ffffff07;
  pointer-events: none;
}

.hero h1 {
  font-size: clamp(54px,8vw,98px);
  letter-spacing: 2px;
  text-shadow: 0 8px 25px #182a1e38;
}

/* Floating category navigation */
.top {
  background: #647048f4;
  color: white;
  border-radius: 24px;
  max-width: 1360px;
  margin: -32px auto 0;
  z-index: 25;
  padding: 11px 17px;
  box-shadow: 0 15px 40px #25381c2b;
  backdrop-filter: blur(12px);
}

.tabs { gap: 7px; }

.tab {
  background: #ffffff17;
  border: 1px solid #ffffff30;
  color: white;
  min-width: 105px;
  border-radius: 14px;
  padding: 13px 16px;
  font-size: 14px;
  transition: .2s;
}

.tab.active {
  background: white;
  color: #405238;
  border-color: white;
  box-shadow: 0 5px 15px #1d2e1526;
}

.tab:hover { transform: translateY(-2px); }

.tools input {
  background: white;
  border-color: #ffffff6b;
}

.small {
  background: #ffffffe8;
  border-color: #ffffff91;
  color: #334738;
}

main { max-width: 1360px; }

/* Editorial category headings */
.welcome { padding-top: 12px; }

.welcome h2 {
  font-size: clamp(29px,3vw,45px);
  font-weight: 900;
}

.welcome::before {
  content: "MOTIF / EXPLORE THE COLLECTION";
  display: block;
  width: 100%;
  color: #8a9777;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
  direction: ltr;
  text-align: right;
}

.rail {
  gap: 9px;
  padding: 23px 0;
}

.chip {
  border-radius: 999px;
  padding: 11px 19px;
  font-weight: 800;
  box-shadow: 0 3px 15px #253c2810;
}

.chip.active {
  background: var(--green);
  border-color: var(--green);
}

/* Graphic section numbers */
#groups { counter-reset: motif-group; }

.group {
  counter-increment: motif-group;
  margin-bottom: 52px;
  scroll-margin-top: 140px;
}

.heading {
  gap: 14px;
  margin-bottom: 19px;
}

.heading::before {
  content: counter(motif-group,decimal-leading-zero);
  width: 54px;
  height: 54px;
  display: grid;
  place-items: center;
  flex: none;
  border-radius: 17px;
  background: #e6ece1;
  color: #3a5540;
  font: 800 21px Arial,sans-serif;
}

.heading h3 {
  font-size: clamp(21px,2.2vw,29px);
  font-weight: 900;
}

.heading::after {
  height: 1px;
  background: linear-gradient(to left,#cad6c9,transparent);
}

/* Photographic editorial grid */
.products {
  display: grid;
  grid-template-columns: repeat(6,minmax(0,1fr));
  gap: 16px;
}

.product {
  grid-column: span 2;
  display: block;
  position: relative;
  isolation: isolate;
  min-width: 0;
  min-height: 270px;
  border: 0;
  background:
    radial-gradient(
      circle at 20% 30%,
      #d5e2cb,
      #7e9b7d
    );
  border-radius: 23px;
  overflow: hidden;
  padding: 0;
  box-shadow: 0 12px 35px #2435211c;
  transition: transform .25s,box-shadow .25s;
}

/* First two products are wide banners */
.product:first-child {
  grid-column: span 6;
  min-height: 420px;
}

.product:nth-child(2) {
  grid-column: span 6;
  min-height: 330px;
}

.product:nth-child(3),
.product:nth-child(4) {
  grid-column: span 3;
  min-height: 315px;
}

.product:hover {
  transform: translateY(-3px);
  box-shadow: 0 20px 45px #24352130;
}

/* Full-bleed images */
.product .photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 0;
  object-fit: cover;
  transition: transform .5s;
  z-index: 0;
}

.product:hover .photo {
  transform: scale(1.045);
}

/* Overlay to make text readable */
.product::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    linear-gradient(
      to top,
      #13231ae8 1%,
      #13261cbd 21%,
      #223d2547 48%,
      transparent 85%
    );
}

/* Product information over image */
.product .details {
  position: absolute;
  z-index: 2;
  bottom: 0;
  right: 0;
  left: 0;
  color: white;
  padding: 27px 31px 26px;
  gap: 6px;
  min-width: 0;
  text-shadow: 0 2px 12px #14251b66;
}

.product .name {
  font-size: clamp(18px,2vw,28px);
  font-weight: 900;
  line-height: 1.45;
  color: white;
}

.product .desc {
  font-size: 12px;
  line-height: 1.8;
  color: #f0f3eacc;
  max-width: 600px;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}

.product .cost {
  font-size: clamp(18px,2vw,24px);
  color: white;
  font-weight: 900;
  margin: 2px 0 0;
}

.product .cost::before {
  content: "قیمت / ";
  font-size: 11px;
  color: #ffffffe0;
  font-weight: 500;
}

/* Add-to-selection button */
.product .add {
  z-index: 5;
  left: 18px;
  top: 18px;
  bottom: auto;
  width: 44px;
  height: 44px;
  font-size: 26px;
  border-radius: 15px;
  background: #ffffffea;
  color: #334838;
  box-shadow: 0 7px 18px #19241e44;
}

.product .add:hover {
  background: #dce5d3;
}

/* Footer */
.footer {
  background: #ffffffee;
  backdrop-filter: blur(12px);
}

.footer .primary {
  padding: 13px 23px;
  box-shadow: 0 8px 18px #29422c30;
}

/* Tablet layout */
@media (max-width:990px) {
  .product,
  .product:nth-child(3),
  .product:nth-child(4) {
    grid-column: span 3;
  }

  .product:first-child,
  .product:nth-child(2) {
    grid-column: span 6;
  }

  .top {
    margin-left: 10px;
    margin-right: 10px;
  }
}

/* Mobile photo stories */
@media (max-width:680px) {
  .hero { height: 220px; }

  .top {
    top: 0;
    gap: 8px;
    padding: 9px;
    border-radius: 16px;
    margin: -20px 8px 0;
  }

  .tabs { gap: 4px; }

  .tab {
    min-width: 0;
    font-size: 11px;
    padding: 10px 3px;
  }

  .tools { width: 100%; }

  .tools input {
    flex: 1;
    width: 0;
  }

  .welcome { padding-top: 3px; }
  .welcome h2 { font-size: 27px; }

  .rail { padding: 15px 0; }

  .chip {
    padding: 9px 14px;
    font-size: 11px;
  }

  .group { margin-bottom: 35px; }

  .heading::before {
    width: 42px;
    height: 42px;
    font-size: 16px;
  }

  .heading h3 { font-size: 20px; }

  .products {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .product,
  .product:first-child,
  .product:nth-child(2),
  .product:nth-child(3),
  .product:nth-child(4) {
    grid-column: 1;
    min-height: 270px;
    border-radius: 20px;
  }

  .product:first-child {
    min-height: 320px;
  }

  .product .details {
    padding: 18px 20px 20px;
  }

  .product .name { font-size: 21px; }
  .product .desc { font-size: 11px; }
  .product .cost { font-size: 21px; }

  .product .add {
    left: 12px;
    top: 12px;
    width: 39px;
    height: 39px;
  }

  .footer { gap: 6px; }
  .footer a { font-size: 11px; }
}
</style>

<style>
/* ========================================
   MOTIF - MOBILE IMAGE FIX V2
   Bigger Photos + White Background Blending
   ======================================== */

@media (max-width: 680px) {

  /* زمینه کارت با رنگ عکس ترکیب شود */
  .product {
    position: relative !important;
    overflow: hidden !important;
    isolation: isolate !important;

    background: linear-gradient(
      180deg,
      #e1e9dd 0%,
      #d5e1d3 35%,
      #9eaf9f 68%,
      #293f32 100%
    ) !important;
  }

  /* حذف افکت روشن اضافی نسخه قبل */
  .product::before {
    content: none !important;
    display: none !important;
  }

  /* عکس بزرگ و بدون مستطیل سفید */
  .product .photo {
    position: absolute !important;

    inset: 0 !important;
    top: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    left: 0 !important;

    width: 100% !important;
    height: 100% !important;
    max-width: none !important;

    padding: 0 !important;
    margin: 0 !important;
    border: 0 !important;
    border-radius: 0 !important;

    object-fit: contain !important;
    object-position: center !important;

    background: transparent !important;

    /* ترکیب سفیدی عکس با زمینه سبز */
    mix-blend-mode: multiply !important;

    /* حذف ماسک قبلی که عکس را کوچک می‌کرد */
    -webkit-mask-image: none !important;
    mask-image: none !important;

    opacity: 1 !important;
    filter: none !important;

    /* بزرگ‌تر شدن سوژه */
    transform: scale(1.25) !important;
    transform-origin: center 43% !important;

    z-index: 1 !important;
    transition: none !important;
  }

  .product:hover .photo {
    transform: scale(1.25) !important;
  }

  /* گرادیان خوانایی نوشته‌ها */
  .product::after {
    content: "" !important;
    position: absolute !important;
    inset: 0 !important;

    background: linear-gradient(
      to top,
      rgba(18, 37, 27, .96) 0%,
      rgba(18, 37, 27, .78) 19%,
      rgba(18, 37, 27, .34) 43%,
      rgba(18, 37, 27, 0) 76%
    ) !important;

    z-index: 2 !important;
    pointer-events: none !important;
  }

  /* نام، توضیحات و قیمت */
  .product .details {
    position: absolute !important;
    z-index: 3 !important;
  }

  /* دکمه افزودن محصول */
  .product .add {
    z-index: 4 !important;
  }

}
</style>

<style>
/* MOTIF - Logo Size Correction */

/* Desktop */
.hero > div > img {
    width: min(480px, 88vw) !important;
    max-width: 100% !important;
    max-height: 130px !important;

<script>
'use strict';

/* GOOGLE SHEETS */
const CSV_URL =
'https://docs.google.com/spreadsheets/d/e/2PACX-1vTlPbSAGPPmOn2jK23XStOJCC5gVsherENSUBr4EGWwgeOUU39_FJ1CINa_nZk-Ss0QZejNTRBGwUhU/pub?output=csv';

/*
Each subcategory:
[id, Persian title, English title, initial slots]
*/
const sections = {
  cafe: [
    ['cafe-espresso-base','اسپرسو بیس','Espresso Base',14],
    ['cafe-chocolate-bar','هات درینک','Hot Drinks',7],
    ['cafe-tea-herbal','چای و دمنوش','Tea & Herbal',11],
    ['cafe-ice','آیس','Iced Drinks',9],
    ['cafe-smoothie','اسموتی','Smoothies',7],
    ['cafe-mocktail','ماکتیل','Mocktails',7],
    ['cafe-ice-cream-shakes','بستنی و شیک‌ها','Ice Cream & Shakes',9],
    ['cafe-refresher','رفرشر','Refreshers',3],
    ['cafe-brewed-coffee','قهوه دمی','Brewed Coffee',5],
    ['cafe-beverages','نوشیدنی','Beverages',9],
    ['cafe-cake','کیک','Cake',3]
  ],
  food: [
    ['food-salad-starter','سالاد و استارتر','Salads & Starters',9],
    ['food-burger-panini','برگر و پنینی','Burgers & Paninis',10],
    ['food-pasta','پاستا','Pasta',2],
    ['food-pizza','پیتزا','Pizza',10],
    ['food-main-course','غذای اصلی','Main Course',3]
  ],
  breakfast: [
    ['breakfast-breakfast-snacks','صبحانه و میان‌وعده','Breakfast & Snacks',6]
  ],
  hookah: [
    ['hookah-hookah','هوکا','Hookah',10]
  ]
};

const categories = {
  cafe:['کافه','Café','☕'],
  food:['غذا','Food','🍽'],
  breakfast:['صبحانه','Breakfast','☀'],
  hookah:['قلیان','Hookah','♧']
};

const $ = id => document.getElementById(id);

const state = {
  page:'cafe',
  sub:'all',
  lang:'fa',
  query:'',
  records:[],
  cart:new Map()
};

const storageKey = 'motif_csv_cache_v2';

/* CSV PARSER */
function csvParse(source) {
  const rows = [];
  const row = [];
  let field = '';
  let quoted = false;

  for(let i=0;i<source.length;i++) {
    const c = source[i];

    if(c === '"') {
      if(quoted && source[i+1] === '"') {
        field += '"';
        i++;
      } else {
        quoted = !quoted;
      }
    }
    else if(c === ',' && !quoted) {
      row.push(field);
      field = '';
    }
    else if((c === '\n' || c === '\r') && !quoted) {
      if(c === '\r' && source[i+1] === '\n') i++;
      row.push(field);

      if(row.some(x => x !== '')) {
        rows.push(row.slice());
      }
      row.length = 0;
      field = '';
    }
    else {
      field += c;
    }
  }

  row.push(field);
  if(row.some(x => x !== '')) rows.push(row);

  if(!rows.length) return [];

  const keys = rows.shift().map((x,i) =>
    i === 0 ? x.replace(/^\uFEFF/,'').trim() : x.trim()
  );

  return rows.map(values =>
    Object.fromEntries(
      keys.map((k,i) => [k,(values[i] || '').trim()])
    )
  );
}

function active(r) {
  return ![
    'false','0','no','inactive','غیرفعال'
  ].includes(
    String(r.active || 'true').toLowerCase().trim()
  );
}

/* GENERATE INITIAL PRODUCT IDS */
function seed() {
  const list = [];

  Object.entries(sections).forEach(([category,arr]) =>
    arr.forEach(([sub,fa,en,n]) => {
      for(let i=1;i<=n;i++) {
        list.push({
          product_id:sub+'-'+String(i).padStart(3,'0'),
          category_id:category,
          subcat_id:sub,
          name_fa:'',
          name_en:'',
          price:'',
          active:'true'
        });
      }
    })
  );

  return list;
}

function items() {
  const indexed = new Map(
    seed().map(r => [r.product_id,r])
  );

  state.records.forEach(r => {
    if(r.product_id) {
      const existing = indexed.get(r.product_id) || {};
      indexed.set(r.product_id,{
        ...existing,
        ...r
      });
    }
  });

  return [...indexed.values()]
    .filter(active)
    .filter(r =>
      sections[r.category_id]?.some(
        s => s[0] === r.subcat_id
      )
    );
}

function tr(fa,en) {
  return state.lang === 'fa' ? fa : en;
}

function make(tag,cls,content) {
  const el = document.createElement(tag);
  if(cls) el.className = cls;
  if(content != null) el.textContent = content;
  return el;
}

function productName(r) {
  return (
    state.lang === 'fa'
      ? (r.name_fa || r.name_en)
      : (r.name_en || r.name_fa)
  ) || tr('نام محصول در حال تکمیل','Product name pending');
}

function productPrice(r) {
  const v = String(r.price || '').replace(/,/g,'').trim();

  return v && !isNaN(Number(v))
    ? Number(v).toLocaleString(
        state.lang === 'fa' ? 'fa-IR' : 'en-US'
      )
    : (r.price_text || tr('قیمت نامشخص','Price unavailable'));
}

function visibleItems() {
  return items().filter(r =>
    state.query
      ? ([
          r.name_fa,
          r.name_en,
          r.desc_fa,
          r.desc_en,
          r.product_id
        ].join(' ').toLowerCase().includes(
          state.query.toLowerCase()
        ))
      : true
  );
}

/* RENDER MENU */
function render() {
  document.documentElement.lang = state.lang;
  document.documentElement.dir =
    state.lang === 'fa' ? 'rtl' : 'ltr';

  $('lang').textContent = state.lang === 'fa' ? 'EN' : 'FA';

  $('search').placeholder =
    tr('جست‌وجو در منو...','Search the menu...');

  $('cartOpen').firstChild.textContent =
    tr('لیست انتخاب‌ها (','Selections (');

  $('tabs').replaceChildren();

  Object.entries(categories).forEach(([id,details]) => {
    const b = make(
      'button',
      'tab' + (state.page === id ? ' active' : ''),
      details[2] + ' ' + tr(details[0],details[1])
    );

    b.onclick = () => {
      state.page = id;
      state.sub = 'all';
      state.query = '';
      $('search').value = '';
      render();
    };

    $('tabs').append(b);
  });

  const category = categories[state.page];

  $('heading').textContent =
    tr('منوی '+category[0],category[1]+' Menu');

  const rows = visibleItems()
    .filter(r => r.category_id === state.page);

  $('count').textContent =
    rows.filter(r => r.name_fa || r.name_en)
      .length.toLocaleString(
        state.lang === 'fa' ? 'fa-IR' : 'en-US'
      )
    + ' ' + tr('محصول','products');

  /* SUBCATEGORY FILTERS */
  $('rail').replaceChildren();

  const all = make(
    'button',
    'chip' + (state.sub === 'all' ? ' active' : ''),
    tr('همه','All')
  );

  all.onclick = () => {
    state.sub = 'all';
    render();
  };

  $('rail').append(all);

  sections[state.page].forEach(([id,fa,en]) => {
    const b = make(
      'button',
      'chip' + (state.sub === id ? ' active' : ''),
      tr(fa,en)
    );

    b.onclick = () => {
      state.sub = id;
      render();
    };

    $('rail').append(b);
  });

  /* PRODUCT CARDS */
  $('groups').replaceChildren();
  let found = 0;

  for(const [sub,fa,en] of sections[state.page]) {
    if(state.sub !== 'all' && state.sub !== sub) {
      continue;
    }

    const filtered = rows.filter(r =>
      r.subcat_id === sub &&
      (r.name_fa || r.name_en)
    );

    if(!filtered.length) continue;

    found += filtered.length;

    const group = make('section','group');
    group.id = sub;

    const heading = make('div','heading');
    heading.append(
      make('h3','',tr(fa,en))
    );
    group.append(heading);

    const grid = make('div','products');

    filtered.forEach(r => {
      const box = make('article','product');

      /* IMAGE */
      const img = make('img','photo');
      img.src =
        'images/' +
        encodeURIComponent(r.product_id) +
        '.webp';

      img.alt = productName(r);
      img.loading = 'lazy';

      img.onerror = () => {
        img.onerror = null;
        img.src =
          'data:image/svg+xml,' +
          encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">' +
            '<rect width="120" height="120" fill="#e8eee5"/>' +
            '<text x="60" y="67" text-anchor="middle" fill="#798974" font-size="23">MOTIF</text>' +
            '</svg>'
          );
      };

      /* PRODUCT INFORMATION */
      const info = make('div','details');
      info.append(
        make('div','name',productName(r))
      );

      const desc =
        r[state.lang === 'fa' ? 'desc_fa' : 'desc_en']
        || r.description_text
        || r.desc_fa
        || '';

      if(desc) {
        info.append(
          make('div','desc',desc)
        );
      }

      info.append(
        make('div','cost',productPrice(r))
      );

      /* ADD TO LIST */
      const add = make('button','add','+');

      add.title = tr(
        'افزودن به لیست',
        'Add to list'
      );

      add.onclick = () => {
        state.cart.set(
          r.product_id,
          (state.cart.get(r.product_id) || 0) + 1
        );

        renderCart();
      };

      box.append(img,info,add);
      grid.append(box);
    });

    group.append(grid);
    $('groups').append(group);
  }

  if(!found) {
    $('groups').append(
      make(
        'p',
        'empty',
        tr(
          'محصولی برای نمایش پیدا نشد.',
          'No products found.'
        )
      )
    );
  }
}

/* SELECTION LIST */
function renderCart() {
  const count = [...state.cart.values()]
    .reduce((a,b) => a+b,0);

  $('cartCount').textContent =
    count.toLocaleString('fa-IR');

  $('cartItems').replaceChildren();

  if(!count) {
    $('cartItems').append(
      make(
        'p',
        'empty',
        tr(
          'لیست شما خالی است.',
          'Your list is empty.'
        )
      )
    );
    return;
  }

  const map = new Map(
    items().map(r => [r.product_id,r])
  );

  for(const [id,qty] of state.cart) {
    const r = map.get(id);
    if(!r) continue;

    const line = make('div','drawer-item');

    line.append(
      make('span','',productName(r)+' × '+qty)
    );

    const b = make('button','','حذف');

    b.onclick = () => {
      state.cart.delete(id);
      renderCart();
    };

    line.append(b);
    $('cartItems').append(line);
  }
}

function closeCart() {
  $('drawer').classList.remove('open');
  $('backdrop').classList.remove('open');
}

$('cartOpen').onclick = () => {
  $('drawer').classList.add('open');
  $('backdrop').classList.add('open');
  renderCart();
};

$('cartClose').onclick = closeCart;
$('backdrop').onclick = closeCart;

$('clearCart').onclick = () => {
  state.cart.clear();
  renderCart();
};

$('copyCart').onclick = async () => {
  const map = new Map(
    items().map(r => [r.product_id,r])
  );

  const text = [
    'MOTIF - Selected Items',
    ...([...state.cart].map(([id,n]) => {
      const r = map.get(id);
      return r
        ? productName(r)+' × '+n
        : '('+id+') × '+n;
    }))
  ].join('\n');

  try {
    await navigator.clipboard.writeText(text);
    alert('لیست کپی شد');
  }
  catch {
    window.prompt('متن را کپی کنید',text);
  }
};

/* LANGUAGE AND SEARCH */
$('lang').onclick = () => {
  state.lang = state.lang === 'fa' ? 'en' : 'fa';
  render();
  renderCart();
};

$('search').oninput = e => {
  state.query = e.target.value.trim();
  state.sub = 'all';
  render();
};

/* GOOGLE SHEETS DATA LOADING */
async function load() {
  try {
    const cached = localStorage.getItem(storageKey);

    if(cached) {
      state.records = csvParse(cached);
      render();
    }
  }
  catch {}

  try {
    const response = await fetch(
      CSV_URL +
      (CSV_URL.includes('?') ? '&' : '?') +
      '_ts=' + Date.now(),
      {cache:'no-store'}
    );

    if(!response.ok) {
      throw Error('HTTP '+response.status);
    }

    const csv = await response.text();
    const rows = csvParse(csv);

    if(!rows.length || !rows[0].product_id) {
      throw Error('CSV columns missing');
    }

    state.records = rows;

    try {
      localStorage.setItem(storageKey,csv);
    }
    catch {}

    $('status').style.display = 'none';
    render();
  }
  catch(error) {
    $('status').textContent = tr(
      'دریافت آنلاین منو ممکن نشد؛ در صورت وجود، نسخه ذخیره‌شده نمایش داده می‌شود.',
      'Could not load the live menu; cached data is shown if available.'
    );

    $('status').style.display = 'block';
    render();

    console.error(error);
  }
}

/* INITIALIZE */
render();
renderCart();
load();

/* REFRESH EVERY 5 MINUTES */
setInterval(load,300000);

</script>

/* نمایش کامل عکس بدون بریدگی و زوم */
.product .photo {
  object-fit: contain !important;
  object-position: center !important;
  transform: none !important;
  background: #e2e9df;
}

.product:hover .photo {
  transform: none !important;

<script>
(function () {
  'use strict';

  // Only explicit TRUE means active
  const activeValue = v =>
    ['true', '1', 'yes', 'on'].includes(
      String(v ?? '').trim().toLowerCase()
    );

  const originalRender = render;
  const originalCart = renderCart;

  // Read products exclusively from Google Sheets
  items = function () {
    const latest = new Map();

    for (const r of state.records) {
      const id = String(r.product_id || '').trim();

      if (id) {
        latest.set(id, r);
      }
    }

    return [...latest.values()].filter(r =>
      activeValue(r.active) &&
      String(r.name_fa || r.name_en || '').trim() &&
      Object.hasOwn(categories, r.category_id) &&
      (sections[r.category_id] || []).some(
        s => s[0] === r.subcat_id
      )
    );
  };

  // Remove inactive products from selection list
  renderCart = function () {
    const ids = new Set(
      items().map(r => r.product_id)
    );

    for (const id of state.cart.keys()) {
      if (!ids.has(id)) {
        state.cart.delete(id);
      }
    }

    originalCart();
  };

  // Update category and subcategory visibility
  render = function () {
    const available = items();

    const categoryKeys = Object.keys(categories);

    const availableCats = new Set(
      available.map(r => r.category_id)
    );

    // Automatically select an available category
    if (
      availableCats.size &&
      !availableCats.has(state.page)
    ) {
      state.page = categoryKeys.find(
        id => availableCats.has(id)
      );
    }

    // Reset subcategory if it has no active products
    if (
      state.sub !== 'all' &&
      !available.some(r =>
        r.category_id === state.page &&
        r.subcat_id === state.sub
      )
    ) {
      state.sub = 'all';
    }

    originalRender();

    // Hide fully inactive main categories
    document
      .querySelectorAll('#tabs .tab')
      .forEach((btn, i) => {
        if (!availableCats.has(categoryKeys[i])) {
          btn.remove();
        }
      });

    // Hide fully inactive subcategories
    const subs = sections[state.page] || [];

    document
      .querySelectorAll('#rail .chip')
      .forEach((btn, i) => {
        if (i === 0) return;

        const sub = subs[i - 1]?.[0];

        const hasActive = available.some(r =>
          r.category_id === state.page &&
          r.subcat_id === sub
        );

        if (!hasActive) {
          btn.remove();
        }
      });

    // If the entire menu is inactive
    if (!availableCats.size) {
      document.getElementById('heading')
        .textContent =
        'در حال حاضر محصول فعالی وجود ندارد';

      document.getElementById('rail')
        .replaceChildren();
    }

    renderCart();
  };

  render();

})();
</script>
<script>
/* =========================================
   MOTIF - auto assign product image to card background
   ========================================= */
(function () {
  function applyProductBlendBackground(root = document) {
    const cards = root.querySelectorAll('.product');

    cards.forEach(card => {
      const img = card.querySelector('.photo');
      if (!img) return;

      const setBg = () => {
        const src = img.currentSrc || img.src;
        if (!src) return;

        /* همان عکس را بک‌گراند محو کارت می‌کنیم */
        card.style.setProperty('--card-image', `url("${src}")`);
      };

      if (img.complete) {
        setBg();
      } else {
        img.addEventListener('load', setBg, { once: true });
      }
    });
  }

  /* بار اول */
  window.applyProductBlendBackground = applyProductBlendBackground;
  document.addEventListener('DOMContentLoaded', () => {
    applyProductBlendBackground();
  });

  /* اگر محصولات بعداً دوباره render شدند */
  const observer = new MutationObserver(() => {
    applyProductBlendBackground();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });
})();
</script>
</body>
